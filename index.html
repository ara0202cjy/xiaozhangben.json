<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFCF3">
<title>打工人小账本</title>
<style>
/* ================= 基础 · 奶油薄荷 ================= */
:root{
  --cream:#FFFCF3; --cream2:#F7F1E2; --paper:#FFFFFF;
  --mint:#8FD6BE; --mint-d:#2F8F72; --mint-l:#E3F4EE; --mint-ll:#F1FAF6;
  --coral:#E08A85; --coral-d:#B16067; --coral-l:#FBE9E6;
  --sun:#F3C969; --sun-l:#FDF3DC;
  --ink:#45443E; --ink2:#7C786E; --ink3:#A6A199;
  --line:#E9E1CE; --line2:#DBD2BB;
  --r:14px; --r-s:10px;
  --fs-xs:10.5px; --fs-s:11.5px; --fs-m:12.5px; --fs-l:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:var(--fs-m); color:var(--ink); background:#EDE7DA;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--mint-d)} .neg{color:var(--coral-d)} .mut{color:var(--ink2)} .dim{color:var(--ink3)}

/* ================= 手机外框（桌面预览用） ================= */
.stage{height:100%;display:grid;place-items:center;padding:16px}
.phone{
  position:relative;width:393px;height:min(852px, calc(100dvh - 32px));
  background:var(--cream);border-radius:46px;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 0 0 10px #1C1B19, 0 0 0 12px #3A3833, 0 34px 70px -22px rgba(50,42,28,.6);
}
.island{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:124px;height:36px;border-radius:20px;background:#0B0B0B;z-index:30;
}
.island::after{content:"";position:absolute;right:11px;top:11px;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #2A3A44 0 40%, #0B0B0B 60%)}

/* 导航条 */
.nav{height:40px;flex:none;display:flex;align-items:center;padding:0 16px;gap:8px;
  background:var(--cream);border-bottom:1px solid var(--line)}
.nav h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.4px}
.nav .sub{font-size:var(--fs-xs);color:var(--ink3);font-weight:600;margin-left:2px}
/* 设置按钮（左上角） */
.nav-gear{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);
  background:var(--cream2);flex:none;margin-right:2px}
.nav-gear .ic{width:18px;height:18px}
.nav-gear:active{background:var(--mint-l);color:var(--mint-d)}
/* 设置 / 危险操作按钮 */
.dangerbtn{height:44px;border-radius:11px;background:var(--coral-l);color:var(--coral-d);font-size:var(--fs-m);
  font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.dangerbtn .ic{width:16px;height:16px}
.dangerbtn:active{transform:translateY(1.5px);background:var(--coral);color:#fff}
.dangerbtn.weak{background:var(--cream2);color:var(--ink2)}
.dangerbtn.weak:active{background:var(--line2);color:var(--ink)}
.set-row{display:flex;gap:8px;flex:none}
.set-row .dangerbtn{flex:1}

/* 内容区 */
.screen{flex:1;min-height:0;position:relative}
.page{position:absolute;inset:0;display:none;flex-direction:column;padding:10px 14px 8px;gap:9px}
.page.on{display:flex;animation:fin .22s ease}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 卡片 */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.card.tight{padding:8px 10px}
.h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.h .ic{width:14px;height:14px;color:var(--mint-d)}
.h b{font-size:var(--fs-m);font-weight:800;letter-spacing:.2px}
.h .t{margin-left:auto;font-size:var(--fs-xs);color:var(--ink3);font-weight:600}

/* ================= 页1 记账 ================= */
.seg{display:flex;background:var(--cream2);border-radius:11px;padding:3px;gap:2px;flex:none;
  border:1px solid var(--line)}
.seg button{flex:1;height:30px;border-radius:8px;font-size:var(--fs-m);font-weight:700;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--mint-d);box-shadow:0 1px 3px rgba(0,0,0,.09)}

.amtbox{background:linear-gradient(150deg,#F1FAF6,#FFFDF8);border:1px solid #CFEBE0;border-radius:var(--r);
  padding:7px 14px;display:flex;align-items:center;gap:8px;flex:none}
.amtbox .cur{font-size:19px;font-weight:700;color:var(--mint-d);opacity:.7;flex:none}
.amtin{flex:1;min-width:0;border:none;background:transparent;font-size:30px;font-weight:800;
  letter-spacing:-1.2px;color:var(--ink);width:100%;padding:0}
.amtin::placeholder{color:var(--ink3);opacity:.5;font-weight:700}
.amtin:focus{outline:none}

.catgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:none}
.catgrid button{border:1px solid var(--line);background:#FFFDF8;border-radius:11px;padding:6px 2px 5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);min-height:50px}
.catgrid button .ic{width:19px;height:19px}
.catgrid button span{font-size:var(--fs-xs);font-weight:700}
.catgrid button.on{background:var(--mint-l);border-color:var(--mint);color:var(--mint-d)}

.objwrap{display:flex;flex-direction:column;gap:4px;flex:none}
.objlabel{font-size:var(--fs-xs);font-weight:800;color:var(--ink2);padding-left:2px}
.objchips{display:flex;gap:6px;flex-wrap:wrap}
.objchips button{border:1px solid var(--line);background:#FFFDF8;border-radius:99px;padding:6px 12px;
  font-size:var(--fs-s);font-weight:700;color:var(--ink2)}
.objchips button.on{background:var(--mint);color:#fff;border-color:var(--mint)}

/* 账号切换 */
.acctwrap{display:flex;flex-direction:column;gap:4px;flex:none}
.acctwrap .objlabel{color:var(--mint-d)}
.acctchips{display:flex;gap:6px}
.acctchips button{border:1px solid var(--line);background:#FFFDF8;border-radius:99px;padding:5px 16px;font-size:var(--fs-m);font-weight:800;color:var(--ink2)}
.acctchips button.on{background:var(--mint-d);color:#fff;border-color:var(--mint-d)}
/* 账本切换（主账本 / 亲子账本） */
.ledgerwrap{display:flex;flex-direction:column;gap:4px;flex:none;margin-top:1px}
.ledgerwrap .objlabel{color:var(--sun-d,#B98B1C)}
.ledgerchips button.on{background:var(--sun);color:#7a5a00;border-color:var(--sun)}

/* 设置面板：账本 / 账号管理列表 */
.mgmt-list{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.mi{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:11px;background:#FFFDF8;overflow:hidden}
.mi.on{border-color:var(--mint);background:var(--mint-l)}
.mi-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:transparent;padding:9px 11px;text-align:left}
.mi-name{font-size:var(--fs-m);font-weight:800;color:var(--ink2);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mi-sub{font-size:10px;color:var(--ink3);font-weight:600;line-height:1.2}
.mi-acts{display:flex;gap:2px;padding-right:6px;flex:none}
.mi-act{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:#fff;display:grid;place-items:center;color:var(--ink3)}
.mi-act .ic{width:15px;height:15px}
.mi-act:active{background:var(--cream2)}
.mi-act[data-act="del"]:active{background:#FBE6E6;color:#C0392B;border-color:#EBCACA}
.mi-act[data-act="switch"]:active{background:var(--mint-l);color:var(--mint-d)}
.weakbtn{width:100%;height:38px;border-radius:10px;border:1px dashed var(--line2);background:transparent;
  color:var(--mint-d);font-size:var(--fs-m);font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px}
.weakbtn:active{background:var(--mint-l)}

.row2{display:flex;gap:7px;flex:none;align-items:center}
.inp{flex:1;min-width:0;height:36px;padding:0 11px;border-radius:10px;border:1px solid var(--line2);
  background:#FFFDF8;font-size:var(--fs-m);font-weight:600}
.inp::placeholder{color:var(--ink3);font-weight:500}
.inp:focus{border-color:var(--mint);background:#fff}

.bigbtn{height:46px;border-radius:13px;background:var(--mint);color:#fff;font-size:var(--fs-l);font-weight:800;
  box-shadow:0 2px 0 #58AC8E;flex:none;display:flex;align-items:center;justify-content:center;gap:6px}
.bigbtn:active{transform:translateY(1.5px);box-shadow:0 0 0 #58AC8E}
.bigbtn .ic{width:17px;height:17px}

/* 高频备注快捷（可增删） */
.quicknotes{display:flex;flex-wrap:wrap;gap:5px;flex:none;max-height:58px;overflow-y:auto;padding-top:1px;align-items:center}
.qn{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line2);background:#FFFDF8;border-radius:99px;
  padding:4px 6px 4px 10px;font-size:10px;font-weight:700;color:var(--ink2);white-space:nowrap}
.qn:active{background:var(--mint-l);color:var(--mint-d)}
.qn .x{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;background:var(--cream2);
  color:var(--ink3);font-size:13px;line-height:1;flex:none}
.qn .x:active{background:var(--coral);color:#fff}
.qn.add{border-style:dashed;color:var(--mint-d);padding:4px 10px}
.qn.add .ic{width:11px;height:11px}
.qn-in{flex:1;min-width:90px;height:26px;border:1px solid var(--mint);border-radius:99px;padding:0 10px;
  font-size:11px;font-weight:700;background:#fff}
/* 详单筛选 */
.filts{display:flex;flex-direction:column;gap:5px;flex:none}
.filtrow{display:flex;gap:6px;align-items:center}
.flab{font-size:9.5px;font-weight:800;color:var(--ink3);flex:none;width:40px}
.fpills{display:flex;gap:5px;overflow-x:auto;flex:1;min-width:0;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.fpills::-webkit-scrollbar{display:none}
.fpill{padding:4px 9px;border-radius:99px;border:1px solid var(--line2);background:#FFFDF8;font-size:10px;font-weight:700;
  color:var(--ink2);white-space:nowrap;flex:none}
.fpill.on{background:var(--mint);color:#fff;border-color:var(--mint)}
.fpill.all.on{background:var(--mint-d);border-color:var(--mint-d)}
.fpills.grid2{display:grid;grid-template-columns:repeat(5,1fr);gap:5px 4px;overflow:visible;flex:1;min-width:0}
.fpills.grid2 .fpill{text-align:center;padding:4px 2px;justify-content:center}
/* 高频词：多行换行，不横向滑动 + 可删除 */
.fpills.wrap{display:flex;flex-wrap:wrap;gap:5px;overflow:visible;flex:1;min-width:0}
.fpill .px{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;margin-left:4px;
  background:var(--cream2);color:var(--ink3);font-size:13px;line-height:1;font-weight:800;flex:none}
.fpill.on .px{background:rgba(255,255,255,.38);color:#fff}
.fpill .px:active{background:var(--coral);color:#fff}
.fp-none{font-size:10px;color:var(--ink3);font-weight:600;padding:3px 2px}
.kw{width:100%;flex:none}
.lsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
.lsum div{background:var(--cream2);border:1px solid var(--line);border-radius:10px;padding:5px 4px;text-align:center}
.lsum .k{font-size:9.5px;color:var(--ink2);font-weight:700}
.lsum .v{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px;letter-spacing:-.3px}
.lsum .v.out{color:var(--coral-d)}
.lsum .v.pos{color:var(--mint-d)}

/* ================= 区间选择 ================= */
.range{display:flex;gap:6px;flex:none}
.range select{flex:1;min-width:0;height:34px;padding:0 24px 0 9px;border-radius:10px;border:1px solid var(--line2);
  background:#FFFDF8;font-size:var(--fs-m);font-weight:700;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='11' viewBox='0 0 24 24' fill='none' stroke='%237C786E' stroke-width='2.6' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center}
.range select:disabled{opacity:.4}

.rng2{display:flex;gap:10px;flex:none}
.rngcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rngcap{font-size:var(--fs-xs);font-weight:800;color:var(--ink2);padding-left:2px}

/* 汇总条 */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
.sum div{background:var(--mint-ll);border:1px solid #D8EEE5;border-radius:11px;padding:6px 8px}
.sum .k{font-size:var(--fs-xs);color:var(--ink2);font-weight:700}
.sum .v{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px;margin-top:1px}
.sum div.out{background:var(--coral-l);border-color:#F3D2CE}
.sum div.out .v{color:var(--coral-d)}

/* 条形图 */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row .top{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-s);margin-bottom:3px}
.bar-row .nm{font-weight:700;display:flex;align-items:center;gap:4px;min-width:0}
.bar-row .nm .ic{width:12px;height:12px;color:var(--ink3)}
.bar-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .vv{font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.bar-row .vv em{font-style:normal;color:var(--ink3);font-weight:600;font-size:var(--fs-xs);margin-left:4px}
.track{height:9px;border-radius:99px;background:var(--cream2);overflow:hidden;border:1px solid var(--line)}
.track>i{display:block;height:100%;border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.track.big{height:15px}
.track.big>i{background-image:linear-gradient(90deg,rgba(255,255,255,.28),rgba(255,255,255,0))}

/* 对比 */
.cmp{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:11px;padding-right:2px}
.cmp-row{display:flex;gap:8px;align-items:center}
.cmp-lab{width:58px;flex:none;font-size:var(--fs-s);font-weight:800;color:var(--ink2);line-height:1.2}
.cmp-bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cmp-line{display:flex;align-items:center;gap:7px}
.cmp-line .track{flex:1}
.cmp-v{width:66px;flex:none;text-align:right;font-size:var(--fs-xs);font-weight:800;font-variant-numeric:tabular-nums}

/* 详单 */
.listhead{display:flex;font-size:var(--fs-xs);color:var(--ink3);font-weight:700;padding:0 2px 2px;flex:none}
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -3px;padding:0 3px}
.rec{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:11px;background:#FFFDF8;
  border:1px solid var(--line);margin-bottom:5px}
.rec .ci{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--mint-l);color:var(--mint-d)}
.rec .ci.inc{background:var(--sun-l);color:#B98B1C}
.rec .ci .ic{width:14px;height:14px}
.rec .bd{flex:1;min-width:0}
.rec .l1{display:flex;align-items:baseline;gap:5px;font-size:var(--fs-m);font-weight:700}
.rec .l1 .cn{color:var(--ink)}
.rec .l1 .nt{color:var(--ink2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rec .l2{font-size:var(--fs-xs);color:var(--ink3);display:flex;gap:5px;margin-top:1px;align-items:center;flex-wrap:wrap}
.rec .rr{text-align:right;flex:none}
.rec .am{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
/* 收入隐私遮罩：cjy 主账号的收入金额默认 *****，点击查看 */
.ink-mask{cursor:pointer;user-select:none;letter-spacing:1px;
  background:var(--sun-l);color:#A57D14;border-radius:5px;padding:0 5px;
  font-variant-numeric:tabular-nums;transition:background .15s}
.ink-mask:hover{background:#F6E6B8}
.ink-mask.revealed{background:transparent;color:inherit;padding:0}
/* 云同步设置 */
.set-inp{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);color:var(--ink);font-size:var(--fs-s);font-weight:600;margin-bottom:7px}
.set-inp:focus{border-color:var(--mint)}
.sync-status{font-size:var(--fs-xs);color:var(--ink3);margin:2px 0 8px;line-height:1.55}
.sync-status b{color:var(--mint-d)}
.sync-btns{display:flex;gap:7px;margin-bottom:8px}
.sync-btns .migbtn{flex:1}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
.switch{width:40px;height:22px;border-radius:11px;background:var(--line2);position:relative;flex:none;transition:background .18s}
.switch i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .18s}
.switch.on{background:var(--mint-d)}
.switch.on i{left:21px}
.crow{display:flex;align-items:center;gap:8px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.crow:first-child{border-top:none}
.crow .lb{font-size:var(--fs-s);font-weight:700;flex:none}
.crow .vl{margin-left:auto;font-size:var(--fs-xs);color:var(--ink3);text-align:right;line-height:1.4}
.chkline{display:flex;align-items:center;gap:6px;font-size:var(--fs-s);font-weight:700;margin:2px 0 9px}
.chkline input{width:15px;height:15px;accent-color:var(--mint-d)}
.rec .del{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);flex:none}
.rec .del .ic{width:13px;height:13px}
.flag{padding:0 4px;border-radius:4px;font-size:9.5px;font-weight:800}
.f-obj{background:var(--mint-l);color:var(--mint-d)}
.f-demo{background:var(--sun-l);color:#A57D14}
.empty{text-align:center;padding:26px 10px;color:var(--ink3);font-size:var(--fs-s)}
.empty .ic{width:26px;height:26px;margin:0 auto 6px;color:var(--line2);display:block;stroke-width:1.4}

/* ================= 底部 Tab ================= */
.tabs{flex:none;background:rgba(255,253,247,.96);border-top:1px solid var(--line);padding:5px 8px 0}
.tabs .in{display:flex;height:48px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink3);font-size:var(--fs-xs);font-weight:700}
.tabs button .ic{width:20px;height:20px}
.tabs button.on{color:var(--mint-d)}
.homebar{height:22px;display:grid;place-items:center;padding-bottom:2px}
.homebar i{display:block;width:134px;height:5px;border-radius:99px;background:#2C2B27;opacity:.85}

/* Toast */
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 40px)}
.toast{background:#3E3C36;color:#FFF9EC;padding:8px 14px;border-radius:12px;font-size:var(--fs-m);
  font-weight:700;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);display:flex;align-items:center;gap:6px;
  animation:tin .26s;max-width:100%}
.toast .ic{width:14px;height:14px;flex:none}
.toast.ok{background:var(--mint-d)} .toast.err{background:var(--coral-d)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 保存确认（带撤销动作） */
.toast.act{pointer-events:auto;background:var(--mint-d);padding:8px 12px}
.toast.act .tx{font-weight:700;font-size:var(--fs-s)}
.toast.act .undo{margin-left:6px;background:rgba(255,255,255,.22);color:#fff;border-radius:8px;
  padding:4px 11px;font-size:var(--fs-xs);font-weight:800;flex:none}
.toast.act .undo:active{background:rgba(255,255,255,.42)}

/* 手机真机：铺满 */
@media (max-width:430px),(max-height:700px){
  .stage{padding:0;display:block}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none;max-height:none}
  .island{display:none}
  .tabs{padding-bottom:0}
  .homebar{height:calc(env(safe-area-inset-bottom, 0px) + 8px)}
  .homebar i{display:none}
}

/* 数据迁移（导出/导入 Excel） */
.mig-btns{display:flex;gap:8px;flex:none}
.migbtn{flex:1;height:40px;border-radius:11px;font-size:var(--fs-m);font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:6px;color:#fff}
.migbtn .ic{width:16px;height:16px}
.migbtn.exp{background:var(--mint-d)}
.migbtn.imp{background:var(--ink2)}
.migbtn:active{transform:translateY(1.5px)}
.mig-tip{font-size:9.5px;color:var(--ink3);font-weight:600;margin-top:6px;line-height:1.45}
.mig-tip b{color:var(--mint-d)}

/* 详单记录编辑弹层 */
.sheetmask{position:absolute;inset:0;background:rgba(40,38,32,.45);z-index:70;display:none}
.sheetmask.on{display:block;animation:fin .18s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:71;background:var(--cream);
  border-radius:18px 18px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
  display:none;flex-direction:column;gap:9px;max-height:92%;overflow-y:auto;
  box-shadow:0 -12px 34px -12px rgba(0,0,0,.42)}
.sheet.on{display:flex;animation:sup .26s cubic-bezier(.2,.8,.2,1)}
@keyframes sup{from{transform:translateY(100%)}to{transform:none}}
.sh-head{display:flex;align-items:center;gap:8px;flex:none}
.sh-head b{font-size:var(--fs-l);font-weight:800}
.sh-head .wh{font-size:var(--fs-xs);color:var(--ink3);font-weight:700}
.sh-head .cx{margin-left:auto;width:28px;height:28px;border-radius:9px;background:var(--cream2);
  display:grid;place-items:center;color:var(--ink2);font-size:19px;line-height:1;flex:none}
.sh-btns{display:flex;gap:8px;flex:none}
.sh-btns button{height:42px;border-radius:11px;font-size:var(--fs-m);font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:5px;color:#fff}
.sh-btns button .ic{width:16px;height:16px}
.sh-save{flex:1;background:var(--mint);box-shadow:0 2px 0 #58AC8E}
.sh-save:active{transform:translateY(1.5px);box-shadow:0 0 0 #58AC8E}
.sh-cancel{width:58px;flex:none;background:var(--cream2);color:var(--ink2)}
.sh-del{width:58px;flex:none;background:var(--coral-l);color:var(--coral-d)}
.rec{cursor:pointer}
.rec .del.edit{color:var(--mint-d)}

"use strict";
/* =========================================================
   打工人小账本 · 手机四页版（纯记账，不记录工时）
   数据仅存本机 localStorage，无任何网络请求
   ========================================================= */
const KEY = "dgr_xiaozhangben_v1";
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
let _seq = 0;
const uid = () => Date.now().toString(36) + "_" + (++_seq).toString(36).padStart(4,"0") + Math.random().toString(36).slice(2,6);
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const num = (v, d=0) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
function money(n){
  const neg = n < 0; n = Math.abs(n);
  const s = (Math.round(n*100)/100).toLocaleString("zh-CN",{minimumFractionDigits:0,maximumFractionDigits:2});
  return (neg?"-¥":"¥") + s;
}
const money0 = n => (n<0?"-¥":"¥") + Math.round(Math.abs(n)).toLocaleString("zh-CN");
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

/* 收入隐私遮罩：仅当前账本 mask=true 时遮罩（主账本含 cjy 数据） */
function inkMask(formatted){
  if (!shouldMask()) return formatted;             // 仅主账本遮罩
  return `<span class="ink-mask" data-real="${esc(formatted)}" role="button" tabindex="0" title="点击查看收入">*****</span>`;
}

/* ---------- 分类与支出对象 ---------- */
const CATS = {
  expense:[
    {id:"food",name:"餐饮",ic:"c-food"},
    {id:"transit",name:"出行",ic:"c-transit"},
    {id:"shop",name:"购物",ic:"c-shop"},
    {id:"fun",name:"娱乐",ic:"c-fun"},
    {id:"study",name:"教育",ic:"c-study"},
    {id:"gift",name:"人情",ic:"c-gift"},
    {id:"other",name:"其他",ic:"c-other"}
  ],
  income:{
    cjy:[ {id:"salary",name:"工资",ic:"c-salary"},
          {id:"side",name:"副业",ic:"c-side"},

          {id:"other",name:"其他",ic:"c-other"} ],

/* ---------- 存储 ---------- */

/* 历史分类 id → 现用分类 id（改分类名后旧记录不会落到"其他"） */
const CAT_MIGRATE = { snack:"food", home:"other", med:"other" };

/* ---------- 初始数据 ----------
   工作台可存多个账号；每个账号含若干账本（数组，动态增删、可改名）；
   每个账本独立记录与统计。账本带 profile（收入分类集：cjy / lc）与 mask（收入遮罩）。 */
function makeLedger(name, profile, mask){
  return { id: uid(), name: name || "新账本", profile: profile || "cjy", mask: !!mask,
           records: [], quickNotes: [] };
}
function normRecs(records){
  records = Array.isArray(records) ? records : [];
  return records.map(r => Object.assign(
    {id:uid(), date:iso(new Date()), time:"", type:"expense", amount:0, cat:"other", target:"", note:"", demo:false}, r));
}
function makeLedgerFrom(name, profile, mask, records, quickNotes){
  const lg = makeLedger(name, profile, mask);
  lg.records = normRecs(records);
  lg.quickNotes = Array.isArray(quickNotes) ? quickNotes.slice() : topNotesFrom(lg.records);
  return lg;
}
/* 账号：当前账本 cur(数组下标) + 本地密码 pass + 云端配置 cloud + 账本数组 ledgers */
function blankAcc(pass){
  return { cur: 0, pass: pass || "",
           cloud: { token:"", gistId:"", autoSync:true, lastSync:0 },
           ledgers: [ makeLedger("主账本","cjy",false) ] };
}
/* 种子：chenjy 账号，密码 000000，含「主账本(cjy)」「亲子账本(lc)」 */
function seedChenjy(){
  const a = blankAcc(hashPwd("000000"));
  a.ledgers[0] = makeLedgerFrom("主账本","cjy",true);
  a.ledgers.push(makeLedgerFrom("亲子账本","lc",false));
  return a;
}
function profileOf(key){ return key === "lc" ? "lc" : "cjy"; }
function maskOf(key){ return key === "cjy"; }

/* ---------- 账号名解析（导入 / 切换用） ---------- */
function resolveAccount(raw){
  raw = (raw||"").trim();
  if (!raw) return null;
  const low = raw.toLowerCase();
  if (S && S.accounts && low in S.accounts) return low;        // 精确匹配账号名
  const ALIAS = {   // 旧版 / 可读别名 → 现有账号（旧 cjy/lc 均并入 chenjy）
    "cjy":"chenjy","c":"chenjy","主账号":"chenjy","主":"chenjy","本人":"chenjy","我":"chenjy","我的":"chenjy","主记":"chenjy","工资卡":"chenjy","cjy主":"chenjy",
    "lc":"chenjy","l":"chenjy","副账号":"chenjy","副":"chenjy","家人":"chenjy","老婆":"chenjy","孩子":"chenjy","副记":"chenjy","零钱":"chenjy",
    "chenjy":"chenjy","chen":"chenjy","陈记":"chenjy","陈":"chenjy","晨记":"chenjy","cj":"chenjy","cjy2":"chenjy","小陈":"chenjy"
  };
  if (low in ALIAS && S && S.accounts && ALIAS[low] in S.accounts) return ALIAS[low];
  return null;
}

/* 当前账本对象（记录容器） */
function curAccount(){ return S.accounts[S.cur]; }
function curAcc(){ return S.accounts[S.cur].ledgers[S.accounts[S.cur].cur]; }
function curLedgerName(){ return curAcc().name; }
function setLedger(idx){ if (idx >= 0 && idx < S.accounts[S.cur].ledgers.length) S.accounts[S.cur].cur = idx; }
function curProfile(){ return curAcc().profile || "cjy"; }
function shouldMask(){ return !!curAcc().mask; }

function topNotesFrom(records){
  const cnt = {};
  records.forEach(r => { const n = (r.note||"").trim(); if (n) cnt[n] = (cnt[n]||0) + 1; });
  return Object.keys(cnt).sort((a,b) => cnt[b]-cnt[a]).slice(0, 20);
}

/* 把任意格式的账号对象规范成新结构（ledgers 必为数组） */
function normalizeAcc(acc, key){
  if (!acc || typeof acc !== "object") acc = {};
  let ledgers;
  if (Array.isArray(acc.ledgers)){
    ledgers = acc.ledgers.map(lg => {
      const o = { id: lg.id || uid(), name: lg.name || "账本",
                  profile: lg.profile || "cjy", mask: !!lg.mask, records: [], quickNotes: [] };
      o.records = normRecs(lg.records);
      o.quickNotes = Array.isArray(lg.quickNotes) ? lg.quickNotes : topNotesFrom(o.records);
      return o;
    });
    if (!ledgers.length) ledgers = [ makeLedger("主账本","cjy",false) ];
  } else if (acc.ledgers && typeof acc.ledgers === "object"){
    const m = acc.ledgers.main || {}; const k = acc.ledgers.kid || {};
    ledgers = [ makeLedgerFrom("主账本", profileOf(key), maskOf(key), m.records, m.quickNotes) ];
    const kRecs = (k.records && k.records.length) ? k.records : null;
    ledgers.push(kRecs ? makeLedgerFrom("亲子账本", profileOf(key), false, kRecs, k.quickNotes)
                       : makeLedger("亲子账本", profileOf(key), false));
  } else if (acc.records){
    ledgers = [ makeLedgerFrom("主账本", profileOf(key), maskOf(key), acc.records, acc.quickNotes) ];
  } else {
    ledgers = [ makeLedger("主账本","cjy",false) ];
  }
  ledgers.forEach(lg => lg.records.forEach(r => {
    if (r.type === "income") r.target = "";
    else { if (CAT_MIGRATE[r.cat]) r.cat = CAT_MIGRATE[r.cat]; if (!ALL_TARGETS.includes(r.target)) r.target = targetsOf(lg.profile).def; }
  }));
  const cur = (typeof acc.cur === "number" && acc.cur >= 0 && acc.cur < ledgers.length) ? acc.cur : 0;
  if (typeof acc.pass !== "string") acc.pass = "";
  acc.ledgers = ledgers; acc.cur = cur;
  acc.cloud = Object.assign({ token:"", gistId:"", autoSync:true, lastSync:0 }, acc.cloud || {});
  return acc;
}

/* 旧「三账号各自含主/亲子账本」格式 → 单一 chenjy 账号（主账本=旧cjy，亲子账本=旧lc） */
function migrateOldToChenjy(data){
  const chen = blankAcc(hashPwd("000000"));
  const pull = (ac, slot) => {
    const a = data.accounts[ac] || {};
    if (slot === "main" && a.records) return a.records;
    const lg = a.ledgers || {};
    return (lg[slot] && lg[slot].records) || [];
  };
  chen.ledgers[0] = makeLedgerFrom("主账本","cjy",true,
    normRecs(pull("cjy","main")).concat(normRecs(pull("cjy","kid"))));
  chen.ledgers[1] = makeLedgerFrom("亲子账本","lc",false,
    normRecs(pull("lc","main")).concat(normRecs(pull("lc","kid"))));
  const ex = normRecs(pull("chenjy","main")).concat(normRecs(pull("chenjy","kid")));
  if (ex.length) chen.ledgers[0].records = chen.ledgers[0].records.concat(ex);
  const ca = data.accounts.chenjy || {};
  if (typeof ca.pass === "string" && ca.pass) chen.pass = ca.pass;
  const mergeCloud = src => { if (src && src.cloud && src.cloud.token && !chen.cloud.token) chen.cloud = Object.assign(chen.cloud, src.cloud); };
  mergeCloud(ca); mergeCloud(data.accounts.cjy); mergeCloud(data.accounts.lc);
  chen.cur = 0;
  return { cur: "chenjy", accounts: { chenjy: chen } };
}

let S = null;
function save(){
  if (store.ok){ store.set(KEY, JSON.stringify(S)); scheduleCloudPush(); return; }
  if (!save._w){ save._w = true; toast("本地存储不可用，改动可能保存不住，建议换 Chrome / Edge","err"); }
}
function load(){
  let raw = store.get(KEY), data = null;
  if (raw){ try{ data = JSON.parse(raw); }catch(e){ data = null; } }
  let out;
  if (data && data.accounts && typeof data.accounts === "object"){
    const keys = Object.keys(data.accounts);
    const isNew = keys.some(k => Array.isArray(data.accounts[k].ledgers));
    if (isNew){
      out = { cur: (data.cur && data.accounts[data.cur]) ? data.cur : keys[0], accounts: {} };
      keys.forEach(k => out.accounts[k] = normalizeAcc(data.accounts[k], k));
    } else {
      out = migrateOldToChenjy(data);   // 旧三账号格式 → 单一 chenjy 账号
    }
  } else if (data && Array.isArray(data.records)){   // 最早单账号数据 → chenjy 主账本
    const chen = blankAcc(hashPwd("000000"));
    chen.ledgers[0] = makeLedgerFrom("主账本","cjy",true, data.records, data.quickNotes);
    out = { cur:"chenjy", accounts:{ chenjy: chen } };
  } else {
    out = { cur:"chenjy", accounts:{ chenjy: seedChenjy() } };
  }
  /* 清理历史示例数据（demo 标记） */
  Object.keys(out.accounts).forEach(ac => {
    out.accounts[ac].ledgers.forEach(lg => {
      if (lg.records.some(r => r.demo)){
        lg.records = lg.records.filter(r => !r.demo);
        lg.quickNotes = topNotesFrom(lg.records);
        out._cleaned = true;
      }
    });
  });
  return out;
}

/* =========================================================
   区间筛选（点选：年/月/日）
   ========================================================= */
let range = { y:"all", m:"all", d:"all" };
let listKw = "";
let listCats = new Set();
let listNotes = new Set();
function initRange(){
  const now = new Date();
  range = { y:String(now.getFullYear()), m:pad(now.getMonth()+1), d:"all" };
  if (!curAcc().records.some(inRange)) range = { y:"all", m:"all", d:"all" };
}
function inRange(r){
  if (range.y !== "all" && r.date.slice(0,4) !== range.y) return false;
  if (range.m !== "all" && r.date.slice(5,7) !== range.m) return false;
  if (range.d !== "all" && r.date.slice(8,10) !== range.d) return false;
  return true;
}
function stat(){
  let income = 0, expense = 0, n = 0; const byCat = {};
  curAcc().records.forEach(r => {
    if (!inRange(r)) return;
    n++;
    if (r.type === "income") income += r.amount;
    else { expense += r.amount; byCat[r.cat] = (byCat[r.cat]||0) + r.amount; }
  });
  return { income, expense, balance: income - expense, n, byCat };
}
function rangeLabel(){
  if (range.y === "all") return "全部时间";
  if (range.m === "all") return range.y + " 年";
  if (range.d === "all") return `${range.y} 年 ${+range.m} 月`;
  return `${+range.m} 月 ${+range.d} 日`;
}

/* =========================================================
   对比（与总计/详单同一套点选区间：年/月/日）
   ========================================================= */
function compareGranularity(){
  if (range.y === "all") return "year";
  if (range.m === "all") return "month";
  return "day";
}
function compareData(){
  const g = compareGranularity();
  const map = {};
  curAcc().records.forEach(r => {
    if (!inRange(r)) return;
    const [y,m,d] = r.date.split("-").map(Number);
    let key, label, sk;
    if (g === "year"){ key = String(y); label = y + "年"; sk = y; }
    else if (g === "month"){ key = String(m); label = m + "月"; sk = m; }
    else { key = String(d); label = d + "日"; sk = d; }
    if (!map[key]) map[key] = { label, income:0, expense:0, sk };
    if (r.type === "income") map[key].income += r.amount;
    else map[key].expense += r.amount;
  });
  return Object.values(map).sort((a,b) => a.sk - b.sk);
}

function cmpLine(val, maxV, color, inc){

  const txt = (inc?"+":"−") + money0(val);
  const shown = (inc && shouldMask())
    ? `<span class="ink-mask" data-real="${esc(txt)}" role="button" tabindex="0" title="点击查看收入">*****</span>`
    : txt;
  return `<div class="cmp-line">
    <div class="track"><i style="width:${pct}%;background:${color}"></i></div>
    <span class="cmp-v ${inc?"pos":"neg"}">${shown}</span>
  </div>`;
}
function renderCmp(){
  const g = compareGranularity();

    <div class="cmp-row">

}

/* 高频词：按记录中出现频次从高到低，最多 8 个（只保留真实出现过的） */
const NOTE_PILL_MAX = 8;
function noteFreq(){
  const cnt = {};
  curAcc().records.forEach(r => { const n = (r.note||"").trim(); if (n) cnt[n] = (cnt[n]||0) + 1; });

function topFilterNotes(){
  const cnt = noteFreq();
  return curAcc().quickNotes.filter(n => cnt[n] > 0).sort((a,b) => cnt[b] - cnt[a]).slice(0, NOTE_PILL_MAX);
}

function buildPointRange(){
  const years = ["all"];
  const set = new Set(curAcc().records.map(r => r.date.slice(0,4)));
  for (let y = 2026; y <= 2035; y++) years.push(String(y));
  set.forEach(y => { if (years.indexOf(y) < 0) years.push(y); });
  years.sort((a,b) => a === "all" ? -1 : b === "all" ? 1 : a - b);

  ["#selY","#selY2","#cmpY"].forEach(sel => {
    $(sel).innerHTML = years.map(y =>
      `<option value="${y}" ${y===range.y?"selected":""}>${y==="all"?"全部年份":y+" 年"}</option>`).join("");
  });
  const mm = [`<option value="all" ${range.m==="all"?"selected":""}>全年</option>`];
  for (let m = 1; m <= 12; m++) mm.push(`<option value="${pad(m)}" ${range.m===pad(m)?"selected":""}>${m} 月</option>`);
  ["#selM","#selM2","#cmpM"].forEach(sel => { $(sel).innerHTML = mm.join(""); $(sel).disabled = range.y === "all"; });

  const dd = [`<option value="all" ${range.d==="all"?"selected":""}>整月</option>`];
  for (let d = 1; d <= 31; d++) dd.push(`<option value="${pad(d)}" ${range.d===pad(d)?"selected":""}>${d} 日</option>`);
  ["#selD","#selD2","#cmpD"].forEach(sel => { $(sel).innerHTML = dd.join(""); $(sel).disabled = range.m === "all"; });

  ["#selY","#selY2","#cmpY"].forEach(s => $(s).value = range.y);

/* =========================================================
   云同步（GitHub Gist，纯前端，无需后端）
   与「错题本 / 作业清单」同一套云端布局：
   本机账户密码登录 + GitHub Token + Gist 存数据 + 自动备份
   ========================================================= */
const GIST_API  = "https://api.github.com/gists";
const APP_TAG   = "打工人小账本数据同步";
/* 每个账号独立一个 Gist（文件名含账号 id），实现「不同账号同步不同云端」 */
const gistFileName = ac => "xiaozhangben-" + ac + ".json";

/* ---------- 本机账户（密码只做本机混淆，不同步、不上传） ---------- */
function hashPwd(p){
  let h = 5381; const s = "dgr::" + p;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return "h" + h.toString(36);
}
/* 云同步已并入各账号（S.accounts[ac].cloud），不再有独立的「云账户」登录系统 */

/* 当前账号（S.cur）的云端配置 { token, gistId, autoSync, lastSync } */
function getCloud(){
  const a = S.accounts[S.cur];
  return Object.assign({ token:"", gistId:"", autoSync:true, lastSync:0 }, a.cloud || {});
}
function setCloud(patch){
  const a = S.accounts[S.cur];
  a.cloud = Object.assign({}, a.cloud || {}, patch);
  save();
}

/* ---------- 快照 / 导入（仅当前账号，按账号分 Gist） ---------- */
/* 快照只含「当前账号」的账本数据（cur + ledgers），不含密码与 Token（不上云） */
function snapshot(){
  const a = S.accounts[S.cur];
  return { app: "xiaozhangben", version: 2, exportedAt: new Date().toISOString(),
           account: S.cur, cur: a.cur, ledgers: a.ledgers };
}
/* 从云端恢复当前账号的账本；保留本机密码锁与云端配置 */
function importSnapshot(data){
  if (!data || !data.ledgers) throw new Error("云端数据格式不正确");
  const ac = data.account || S.cur;
  if (!S.accounts[ac]) S.accounts[ac] = blankAcc();
  const prev = S.accounts[ac];
  const norm = normalizeAcc({ cur: data.cur, ledgers: data.ledgers }, ac);
  norm.pass = prev.pass;     // 保留本机密码锁
  norm.cloud = prev.cloud;   // 保留本机云端配置
  S.accounts[ac] = norm;
  save(); renderAll();
}

/* ---------- Gist 接口 ---------- */
function gistHeaders(){
  const t = (getCloud().token || "").trim();
  const auth = t.indexOf("github_pat_") === 0 ? "Bearer " + t : "token " + t;
  return { "Authorization": auth, "Content-Type": "application/json", "Accept": "application/vnd.github+json" };
}
function normGistId(raw){ return (raw || "").trim().split("/").pop() || ""; }
function errMsg(status, msg, act){
  if (status === 401 || status === 403) return act + "失败：Token 无效或权限不足（请生成只勾 gist 权限的 Token）";
  if (status === 404) return act + "失败：Gist 不可见，多半是 Token 无效/无 gist 权限，或 Gist ID 填错";
  return act + "失败（HTTP " + status + (msg ? "：" + msg : "") + "）";
}
function needCloud(){
  const c = getCloud();
  if (!c.token) throw new Error("还没填 GitHub Token");
  if (!c.gistId) throw new Error("还没有 Gist，请点「自动创建 Gist」或填写已有 Gist ID");
  return c;
}
/* 新建一个私密 Gist 存数据 */
async function gistCreate(){
  const c = getCloud();
  if (!c.token) throw new Error("请先填 GitHub Token");
  const r = await fetch(GIST_API, {
    method: "POST", headers: gistHeaders(),
    body: JSON.stringify({ description: APP_TAG, public: false,
      files: { [gistFileName(S.cur)]: { content: JSON.stringify(snapshot(), null, 2) } } })
  });
  if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(errMsg(r.status, j.message, "创建 Gist")); }
  const g = await r.json();
  setCloud({ gistId: g.id, lastSync: Date.now(), autoSync: true });
  return g;
}
async function gistUpload(){
  const c = needCloud(), id = normGistId(c.gistId);
  const r = await fetch(GIST_API + "/" + id, {
    method: "PATCH", headers: gistHeaders(),
    body: JSON.stringify({ description: APP_TAG,
      files: { [gistFileName(S.cur)]: { content: JSON.stringify(snapshot(), null, 2) } } })
  });
  if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(errMsg(r.status, j.message, "上传")); }
  setCloud({ lastSync: Date.now() });
  return true;
}
async function gistDownload(){
  const c = needCloud(), id = normGistId(c.gistId);
  const r = await fetch(GIST_API + "/" + id, { headers: gistHeaders() });
  if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(errMsg(r.status, j.message, "下载")); }
  const g = await r.json();
  const f = g.files && g.files[gistFileName(S.cur)];
  if (!f || !f.content) throw new Error("Gist 里没有找到 " + gistFileName(S.cur));
  _importing = true;
  try { importSnapshot(JSON.parse(f.content)); } finally { _importing = false; }
  setCloud({ lastSync: Date.now() });
  return true;
}
async function gistTest(){
  const c = getCloud();
  if (!c.token) throw new Error("请先填 GitHub Token");
  const u = await fetch("https://api.github.com/user", { headers: gistHeaders() });
  if (!u.ok){ const j = await u.json().catch(() => ({}));
    throw new Error("Token 无效或权限不足（" + (j.message || "HTTP " + u.status) + "）"); }
  const me = await u.json();
  let gistMsg = "尚未创建 Gist";
  if (c.gistId){
    const g = await fetch(GIST_API + "/" + normGistId(c.gistId), { headers: gistHeaders() });
    gistMsg = g.ok ? "Gist 可访问 ✓" : (g.status === 404 ? "Gist 不可见：Token 无权访问或 ID 填错" : "Gist 检测 HTTP " + g.status);
  }
  return { login: me.login, gist: gistMsg };
}

/* 用 Token 列出自己的 Gist，找出存着本账本文件的那个（换设备时自动找回） */
async function gistFind(){
  const c = getCloud();
  if (!c.token) throw new Error("请先填 GitHub Token");
  const r = await fetch("https://api.github.com/gists?per_page=100", { headers: gistHeaders() });
  if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(errMsg(r.status, j.message, "查找")); }
  const list = await r.json();
  const hit = (list || []).find(g => g.files && g.files[gistFileName(S.cur)]);
  return hit || null;
}

function switchAccount(ac){
  if (!S.accounts[ac]) return false;
  if (ac === S.cur) return false;

  if (hp && !_unlocked[ac]){
    const p = prompt("「" + ac + "」需要密码才能打开：");
    if (p === null) return false;
    if (hashPwd(p) !== hp){ toast("密码错误", "err"); return false; }
    _unlocked[ac] = true;
  }
  S.cur = ac; save();
  renderAcctChips(); renderLedgerChips(); renderAcctMgmt(); renderLedgerMgmt(); renderAccountBox();
  renderCats(); renderTargets(); showObj();
  initRange(); buildPointRange(); syncPointRange();
  renderQuickNotes(); renderFiltPills();
  renderTotal(); renderList(); renderCmp();
  toast("已切换到账号 " + ac + "，数据独立");

}
function renderLedgerMgmt(){
  const wrap = $("#ledgerMgmt"); if (!wrap) return;
  const ac = curAccount();
  const nm = $("#mgmtAcName"); if (nm) nm.textContent = S.cur;
  wrap.innerHTML = ac.ledgers.map((lg,i) => {
    const cnt = lg.records.length;

      <button class="mi-main" data-led="${i}">
        <span class="mi-name">${esc(lg.name)}</span>
        <span class="mi-sub">${lg.profile==="lc"?"亲子":"主"} · ${cnt} 笔${lg.mask?" · 收入隐藏":""}</span>
      </button>
      <span class="mi-acts">
        <button class="mi-act" data-act="rename" data-led="${i}" title="重命名"><svg class="ic"><use href="#i-edit"/></svg></button>
        <button class="mi-act" data-act="del" data-led="${i}" title="删除"><svg class="ic"><use href="#i-trash"/></svg></button>
      </span>
    </div>`;
  }).join("");
  wrap.querySelectorAll(".mi-main").forEach(b => b.onclick = () => {
    const i = parseInt(b.dataset.led,10);
    if (i === ac.cur) return;
    setLedger(i); save();

  });
  wrap.querySelectorAll(".mi-act").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const i = parseInt(b.dataset.led,10);
    if (b.dataset.act === "rename") renameLedger(i);
    else delLedger(i);
  });
}
function renameLedger(i){
  const ac = curAccount();
  const lg = ac.ledgers[i]; if (!lg) return;
  const name = (prompt("账本名称：", lg.name) || "").trim();
  if (!name) return;
  lg.name = name; save();
  renderLedgerMgmt(); renderLedgerChips(); renderAccountBox();
  toast("账本已重命名为「" + name + "」");
}
function delLedger(i){
  const ac = curAccount();
  if (ac.ledgers.length <= 1){ toast("每个账号至少保留 1 个账本", "err"); return; }
  const lg = ac.ledgers[i]; if (!lg) return;
  if (!confirm(`删除账本「${lg.name}」？\n该账本的全部 ${lg.records.length} 笔记录将一并删除，且无法恢复！`)) return;
  ac.ledgers.splice(i,1);
  if (ac.cur >= ac.ledgers.length) ac.cur = ac.ledgers.length - 1;
  save();
  renderLedgerMgmt(); renderLedgerChips(); renderAccountBox();
  renderCats(); renderTargets(); showObj();
  initRange(); buildPointRange(); syncPointRange();
  renderQuickNotes(); renderFiltPills(); renderTotal(); renderList(); renderCmp();
  toast("已删除账本「" + lg.name + "」");
}
function renderAcctMgmt(){
  const wrap = $("#acctMgmt"); if (!wrap) return;
  const cnt = $("#mgmtAcCount"); if (cnt) cnt.textContent = Object.keys(S.accounts).length;
  wrap.innerHTML = Object.keys(S.accounts).map(ac => {
    const a = S.accounts[ac];
    const total = a.ledgers.reduce((s,lg)=>s+lg.records.length, 0);
    return `<div class="mi ${ac===S.cur?"on":""}">
      <button class="mi-main" data-ac="${esc(ac)}">
        <span class="mi-name">${esc(ac)}${a.pass?" 🔒":""}</span>
        <span class="mi-sub">${a.ledgers.length} 个账本 · ${total} 笔</span>
      </button>
      <span class="mi-acts">
        <button class="mi-act" data-act="switch" data-ac="${esc(ac)}" title="切换"><svg class="ic"><use href="#i-check"/></svg></button>
        <button class="mi-act" data-act="rename" data-ac="${esc(ac)}" title="重命名"><svg class="ic"><use href="#i-edit"/></svg></button>
        <button class="mi-act" data-act="pass" data-ac="${esc(ac)}" title="改密码"><svg class="ic"><use href="#i-gear"/></svg></button>
        <button class="mi-act" data-act="del" data-ac="${esc(ac)}" title="删除"><svg class="ic"><use href="#i-trash"/></svg></button>
      </span>
    </div>`;
  }).join("");
  wrap.querySelectorAll(".mi-main").forEach(b => b.onclick = () => switchAccount(b.dataset.ac));
  wrap.querySelectorAll(".mi-act").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const ac = b.dataset.ac, act = b.dataset.act;
    if (act === "switch") switchAccount(ac);
    else if (act === "rename") renameAccount(ac);
    else if (act === "pass") changeAccountPass(ac);
    else delAccount(ac);
  });
}
function renameAccount(oldAc){
  const a = S.accounts[oldAc]; if (!a) return;
  const name = (prompt("账号新名称：", oldAc) || "").trim();
  if (!name || name === oldAc) return;
  if (S.accounts[name]){ toast("账号「" + name + "」已存在", "err"); return; }
  S.accounts[name] = a;
  delete S.accounts[oldAc];
  if (S.cur === oldAc) S.cur = name;
  if (_unlocked[oldAc]){ _unlocked[name] = true; delete _unlocked[oldAc]; }
  save();
  renderAcctChips(); renderAcctMgmt(); renderLedgerMgmt(); renderAccountBox();
  renderCats(); renderTargets();
  toast("账号已重命名为「" + name + "」");
}
function changeAccountPass(ac){
  const a = S.accounts[ac]; if (!a) return;
  if (a.pass){
    const old = prompt("输入当前密码：");
    if (old === null) return;
    if (hashPwd(old) !== a.pass){ toast("当前密码错误", "err"); return; }
  }
  const np = prompt("设置新密码（留空=取消加密）：");
  if (np === null) return;
  const v = np.trim();
  a.pass = v ? hashPwd(v) : "";
  if (a.pass) _unlocked[ac] = true; else delete _unlocked[ac];
  save();
  renderAcctMgmt(); renderAcctChips(); renderAccountBox();
  toast(a.pass ? "已设置密码保护 🔒" : "已取消密码保护");
}
function delAccount(ac){
  if (Object.keys(S.accounts).length <= 1){ toast("至少保留 1 个账号", "err"); return; }
  const a = S.accounts[ac]; if (!a) return;
  const total = a.ledgers.reduce((s,lg)=>s+lg.records.length, 0);
  if (!confirm(`删除账号「${ac}」？\n该账号全部 ${total} 笔记录将一并删除，且无法恢复！`)) return;
  delete S.accounts[ac];
  if (_unlocked[ac]) delete _unlocked[ac];
  if (S.cur === ac) S.cur = Object.keys(S.accounts)[0];
  save();
  renderAcctChips(); renderAcctMgmt(); renderLedgerMgmt(); renderAccountBox();
  renderCats(); renderTargets(); showObj();
  initRange(); buildPointRange(); syncPointRange();
  renderQuickNotes(); renderFiltPills();
  renderTotal(); renderList(); renderCmp();
  toast("已删除账号「" + ac + "」");
}

  if (tab !== "add") return;

});

/* =========================================================
   Excel 导入/导出（纯前端、单文件、无外部库）
   写出：最小 xlsx（store ZIP + CRC32 + 内联字符串）
   读入：支持 xlsx（含 deflate 解压 / sharedStrings）与 csv
   纯函数模块（可被测试脚本独立抽取）如下：
   ========================================================= */
//XLSX-START
function xmlEscape(s){
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[m]));
}
function xmlUnescape(s){
  return String(s).replace(/&apos;/g,"'").replace(/&quot;/g,'"').replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&");
}
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  for (const f of files){
    const nameBytes = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const local = new Uint8Array(30 + nameBytes.length + data.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    local.set(data, 30 + nameBytes.length);
    chunks.push(local);
    const cen = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cen.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cen.set(nameBytes, 46);
    central.push(cen);
    offset += local.length;
  }
  const cdSize = central.reduce((s,c) => s + c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);
  const all = [...chunks, ...central, end];
  const total = all.reduce((s,c) => s + c.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  for (const c of all){ out.set(c, p); p += c.length; }
  return out;
}
function colLetter(idx){
  let s = ""; idx += 1;
  while (idx > 0){ const m = (idx - 1) % 26; s = String.fromCharCode(65 + m) + s; idx = Math.floor((idx - 1) / 26); }
  return s;
}
function buildXlsx(sheetName, rows){
  const enc = new TextEncoder();
  const sheetRows = rows.map((row, ri) => {
    const cells = row.map((val, ci) => {
      const ref = colLetter(ci) + (ri + 1);
      if (typeof val === "number" && isFinite(val)){
        return `<c r="${ref}"><v>${val}</v></c>`;
      }
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(val == null ? "" : val)}</t></is></c>`;
    }).join("");
    return `<row r="${ri + 1}">${cells}</row>`;
  }).join("");
  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n` +
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetData>${sheetRows}</sheetData></worksheet>`;
  const files = [
    { name:"[Content_Types].xml", data: enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>') },
    { name:"_rels/.rels", data: enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>') },
    { name:"xl/workbook.xml", data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEscape(sheetName).slice(0,31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`) },
    { name:"xl/_rels/workbook.xml.rels", data: enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>') },
    { name:"xl/worksheets/sheet1.xml", data: enc.encode(sheetXml) }
  ];
  return zipStore(files);
}
function parseSharedStrings(xml){
  const out = [];
  const siRe = /<si>([\s\S]*?)<\/si>/g; let m;
  while ((m = siRe.exec(xml))){
    const inner = m[1]; const parts = [];
    const tRe = /<t[^>]*>([\s\S]*?)<\/t>/g; let t;
    while ((t = tRe.exec(inner))) parts.push(xmlUnescape(t[1]));
    out.push(parts.join(""));
  }
  return out;
}
function parseSheetXml(xml, shared){
  const rows = [];
  const rowRe = /<row\b[^>]*>([\s\S]*?)<\/row>/g; let rm;
  while ((rm = rowRe.exec(xml))){
    const cells = [];
    const cRe = /<c\b([^>]*)>([\s\S]*?)<\/c>/g; let cm;
    while ((cm = cRe.exec(rm[1]))){
      const attr = cm[1], body = cm[2];
      const tM = /t="([^"]+)"/.exec(attr);
      const t = tM ? tM[1] : "";
      let val = "";
      if (t === "inlineStr"){
        const isM = /<is>([\s\S]*?)<\/is>/.exec(body);
        if (isM){
          const parts = []; const tRe = /<t[^>]*>([\s\S]*?)<\/t>/g; let tm;
          while ((tm = tRe.exec(isM[1]))) parts.push(xmlUnescape(tm[1]));
          val = parts.join("");
        }
      } else if (t === "s"){
        const vM = /<v>([\s\S]*?)<\/v>/.exec(body);
        if (vM){ const i = parseInt(vM[1], 10); val = shared[i] != null ? shared[i] : ""; }
      } else {
        const vM = /<v>([\s\S]*?)<\/v>/.exec(body);
        if (vM) val = vM[1].trim();
      }
      cells.push(val);
    }
    rows.push(cells);
  }
  return rows;
}
async function inflateRaw(data){
  if (typeof DecompressionStream === "undefined") return data;
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([data]).stream().pipeThrough(ds);
  const buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}
async function unzipStore(bytes){
  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0; i--){
    if (bytes[i] === 0x50 && bytes[i+1] === 0x4B && bytes[i+2] === 0x05 && bytes[i+3] === 0x06){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error("不是有效的 Excel 文件");
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const cdCount = dv.getUint16(eocd + 10, true);
  const cdOffset = dv.getUint32(eocd + 16, true);
  const entries = []; let p = cdOffset;
  for (let i = 0; i < cdCount; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const fnameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commLen = dv.getUint16(p + 32, true);
    const localOffset = dv.getUint32(p + 42, true);
    const name = new TextDecoder("utf-8").decode(bytes.slice(p + 46, p + 46 + fnameLen));
    const lnameLen = dv.getUint16(localOffset + 26, true);
    const lextraLen = dv.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + lnameLen + lextraLen;
    let data = bytes.slice(dataStart, dataStart + compSize);
    if (method === 8) data = new Uint8Array(await inflateRaw(data));
    entries.push({ name, data, text: new TextDecoder("utf-8").decode(data) });
    p += 46 + fnameLen + extraLen + commLen;
  }
  return entries;
}
function parseCsv(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], field = "", i = 0, inq = false;
  while (i < text.length){
    const c = text[i];
    if (inq){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i += 2; continue; } inq = false; i++; continue; }
      field += c; i++; continue;
    }
    if (c === '"'){ inq = true; i++; continue; }
    if (c === ','){ row.push(field); field = ""; i++; continue; }
    if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    if (c === '\r'){ i++; continue; }
    field += c; i++;
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ""));
}
function normalizeDate(s){
  s = String(s).trim();
  if (!s) return "";
  const m = s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (!m) return "";
  const y = +m[1], mo = +m[2], d = +m[3];
  if (y < 2000 || y > 2100 || mo < 1 || mo > 12 || d < 1 || d > 31) return "";
  return `${y}-${pad(mo)}-${pad(d)}`;
}
function normTime(s){
  s = String(s).trim();
  const m = s.match(/(\d{1,2})[:：](\d{1,2})/);
  if (m) return `${pad(+m[1])}:${pad(+m[2])}`;
  const m2 = s.match(/^(\d{4})$/);
  if (m2) return `${pad(+m2[1].slice(0,2))}:${pad(+m2[1].slice(2))}`;
  return "";
}
//XLSX-END

/* ---------- 导出 / 导入 业务层 ---------- */
function catNameForProfile(profile, r){
  const list = r.type === "expense" ? CATS.expense : (CATS.income[profile] || CATS.income.cjy);
  const c = list.find(x => x.id === r.cat) || list[list.length-1];
  return c.name;
}
function resolveCatId(type, profile, raw){
  raw = (raw||"").trim();
  const list = type === "expense" ? CATS.expense : (CATS.income[profile] || CATS.income.cjy);
  let c = list.find(x => x.id === raw) || list.find(x => x.name === raw);
  return c ? c.id : "other";
}
function matchHeader(h){
  h = (h||"").trim();
  if (/账号|帐户|账户|帐号|account|账?户名|账?号名|所属账号|所属账户/i.test(h)) return "ac";
  if (/^账本$|账簿|账册|ledger/i.test(h)) return "led";
  if (/^日期$|date/i.test(h)) return "date";
  if (/^时间$|时刻|time/i.test(h)) return "time";
  if (/^类型$|收支|type/i.test(h)) return "type";
  if (/^分类$|类别|科目|category|cat/i.test(h)) return "cat";
  if (/^支出对象$|对象|target|object/i.test(h)) return "obj";
  if (/^金额$|数目|钱|amount|price|总额/i.test(h)) return "amt";
  if (/^备注$|说明|摘要|note|remark/i.test(h)) return "note";
  return h;
}
function exportXlsx(){
  const rows = [["账号","账本","日期","时间","类型","分类","支出对象","金额","备注"]];
  Object.keys(S.accounts).forEach(ac => {
    S.accounts[ac].ledgers.forEach(lg => {
      lg.records.forEach(r => {
        rows.push([
          ac,
          lg.name,
          r.date,
          r.time || "",
          r.type === "income" ? "收入" : "支出",
          catNameForProfile(lg.profile, r),
          r.type === "income" ? "" : (r.target || ""),
          r.amount,
          r.note || ""
        ]);
      });
    });
  });
  const xlsx = buildXlsx("账目明细", rows);
  const blob = new Blob([xlsx], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `打工人小账本-账目明细-${iso(new Date())}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`已导出 ${rows.length - 1} 条记录（含全部账号）`);
}
async function importXlsxFile(file){
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  let matrix;
  if (bytes[0] === 0x50 && bytes[1] === 0x4B){
    const entries = await unzipStore(bytes);
    const sheet = entries.find(e => /^xl\/worksheets\/sheet\d+\.xml$/i.test(e.name))
              || entries.find(e => /sheet\d+\.xml$/i.test(e.name));
    if (!sheet) throw new Error("Excel 中未找到工作表");
    const ss = entries.find(e => e.name === "xl/sharedStrings.xml");
    const shared = ss ? parseSharedStrings(ss.text) : [];
    matrix = parseSheetXml(sheet.text, shared);
  } else {
    matrix = parseCsv(new TextDecoder("utf-8").decode(bytes));
  }
  applyImport(matrix, file.name);
}
function ensureLedger(ac, name){
  const a = S.accounts[ac];
  let lg = a.ledgers.find(l => l.name === name);
  if (!lg){ lg = makeLedger(name, /亲子|kid|子/.test(name) ? "lc" : "cjy", false); a.ledgers.push(lg); }
  return a.ledgers.indexOf(lg);
}
function applyImport(matrix, fileName){
  if (!matrix || matrix.length < 2){ toast("文件中没有可导入的数据","err"); return; }
  const header = matrix[0].map(h => (h||"").trim());
  const idx = {};
  header.forEach((h, i) => { const k = matchHeader(h); if (!(k in idx)) idx[k] = i; });
  const col = n => (n in idx ? idx[n] : -1);
  const iAc = col("ac"), iLed = col("led"), iDate = col("date"), iTime = col("time"), iType = col("type"),
        iCat = col("cat"), iObj = col("obj"), iAmt = col("amt"), iNote = col("note");
  if (iDate < 0){ toast("缺少「日期」列，无法导入","err"); return; }
  const newRecs = [];
  let incCount = 0, expCount = 0, skip = 0;
  let unkAc = 0;                       // 账号列有值但无法识别、已归入当前账号的行数
  for (let r = 1; r < matrix.length; r++){
    const row = matrix[r];
    const date = normalizeDate(iDate >= 0 ? row[iDate] : "");
    if (!date){ skip++; continue; }
    const acRaw = (iAc >= 0 ? row[iAc] : "") || "";
    let ac = resolveAccount(acRaw);
    if (!ac){ if (acRaw) unkAc++; ac = S.cur; }   // 未识别的账号值 → 归入当前账号
    if (!S.accounts[ac]) S.accounts[ac] = blankAcc();
    let ledName = "主账本";
    if (iLed >= 0){ const lv = (row[iLed] || "").trim(); if (lv) ledName = /亲子|kid|子/.test(lv) ? "亲子账本" : lv; }
    const ledIdx = ensureLedger(ac, ledName);
    const profile = S.accounts[ac].ledgers[ledIdx].profile;
    const typeRaw = (iType >= 0 ? row[iType] : "") || "支出";
    const type = /收入|收\s*入|in|income/.test(typeRaw.toLowerCase()) ? "income" : "expense";
    const amtRaw = (iAmt >= 0 ? row[iAmt] : "") || "";
    const amount = parseFloat(String(amtRaw).replace(/[¥￥,\s]/g, ""));
    if (!isFinite(amount) || !(amount > 0)){ skip++; continue; }
    const cat = resolveCatId(type, profile, iCat >= 0 ? row[iCat] : "");
    let target = (iObj >= 0 ? row[iObj] : "") || "";
    if (type === "expense"){ if (!ALL_TARGETS.includes(target)) target = targetsOf(profile).def; }
    else target = "";
    const time = normTime(iTime >= 0 ? row[iTime] : "");
    const note = ((iNote >= 0 ? row[iNote] : "") || "").slice(0, 24);
    newRecs.push({ id: uid(), ac, ledName, date, time, type, amount: Math.round(amount*100)/100,
                   cat, target, note, demo: false });
    if (type === "income") incCount++; else expCount++;
  }
  if (!newRecs.length){ toast("没有可导入的有效记录","err"); return; }
  const noAcCol = (iAc < 0);
  let warn = "";
  if (noAcCol) warn = `（未检测到账号列，全部 ${newRecs.length} 条将导入当前账号「${S.cur}」）`;
  else if (unkAc) warn = `（其中 ${unkAc} 条账号无法识别，已归入当前账号「${S.cur}」）`;
  const msg = `将导入 ${newRecs.length} 条（收入 ${incCount} / 支出 ${expCount}）${skip ? `，跳过 ${skip} 条无效` : ""}。\n这些记录会按账号 / 账本分别并入对应位置${warn}，是否继续？`;
  if (!confirm(msg)) return;
  const byKey = {};   // ac + "|" + ledName
  newRecs.forEach(rec => {
    const k = rec.ac + "|" + rec.ledName;
    (byKey[k] = byKey[k] || []).push(rec);
  });
  Object.keys(byKey).forEach(k => {
    const [ac, ledName] = k.split("|");
    if (!S.accounts[ac]) S.accounts[ac] = blankAcc();
    const ledIdx = ensureLedger(ac, ledName);
    const lg = S.accounts[ac].ledgers[ledIdx];
    lg.records.push(...byKey[k]);
    const existing = lg.quickNotes.slice();
    const newNotes = [];
    byKey[k].forEach(r => {
      if (r.note && existing.indexOf(r.note) < 0 && newNotes.indexOf(r.note) < 0) newNotes.push(r.note);
    });
    let arr = newNotes.concat(existing);   // 新导入的排在前面，超 20 时优先保留
    if (arr.length > 20) arr = arr.slice(0, 20);
    lg.quickNotes = arr;
  });
  save();
  renderAcctChips(); renderLedgerChips(); renderLedgerMgmt(); renderAcctMgmt();
  initRange(); buildPointRange(); syncPointRange();
  renderQuickNotes(); renderFiltPills();
  renderTotal(); renderList(); renderCmp(); renderAccountBox();
  go("total");
  toast(`导入成功：${newRecs.length} 条记录`);
}
